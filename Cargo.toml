[workspace]
members = [
    "crates/image-grid-core",
    "crates/image-grid-server",
    "crates/image-grid-mcp",
]
resolver = "3"

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/mlabo-org/codex-image-grid-native"
homepage = "https://github.com/mlabo-org/codex-image-grid-native"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = [
    "io-util",
    "fs",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
